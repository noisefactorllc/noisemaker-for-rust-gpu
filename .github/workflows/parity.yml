name: Parity

# The pixel parity sweep, weekly and on demand, never on push. scripts/parity-summary
# mints every golden fresh with the reference engine's WebGPU backend in
# Chromium, renders every case with nm-render on the same runner, grades them
# (parity/sweep.py) and prints one PARITY-SUMMARY line; it exits nonzero when a
# case is near, failing, skipped or missing. Both engines need a Metal GPU, and
# the GitHub-hosted macOS runners offer only a paravirtual one, so the sweep runs
# on the self-hosted Apple M4 runner group noisemaker-gpu. That group admits this
# workflow on main only; no pull request reaches it, and a host without a native
# Metal device fails the job. Its own concurrency group keeps it apart from the
# push gate (tests.yml).
#
# WebGPU gates: the port renders the reference WGSL and equals the reference's
# WebGPU output, so the gate isolates port regressions. The reference's WebGL2
# output is reported, never gated: a second run grades the same cases against
# WebGL2 goldens (NM_GOLDEN_BACKEND=webgl2) and keeps its log as an artifact.
# Its failures are differences between the reference's own backends, which no
# change to this port can resolve, so that step cannot fail the job.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: noisemaker-gpu
      labels: [noisemaker-gpu]
    timeout-minutes: 150
    steps:
      - name: Require a native Apple-silicon Metal host
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          system_profiler SPDisplaysDataType | grep -q 'Metal Support: Metal'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      # The grader's packages, pinned by hash, in a job-local environment of
      # the host's Python 3.11. scripts/parity-summary uses the first python3
      # on PATH that imports numpy and PIL.
      - name: Python with the grader's packages
        run: |
          set -euo pipefail
          python311="$(realpath "$HOME/.local/bin/python3.11")"
          "$python311" -m venv --copies "$RUNNER_TEMP/parity-python"
          printf '%s\n' \
            'numpy==2.4.6 --hash=sha256:4cfe66903cc32a9921a6733d96b19bb6abf310397581bbad89c228f5abaf0ee8' \
            'Pillow==13.0.0 --hash=sha256:37290fbef0c73e2d51d594eb78fded7dc7170d1c3ad0a890269e6fd8c8c4e061' \
            > "$RUNNER_TEMP/parity-python/requirements.txt"
          "$RUNNER_TEMP/parity-python/bin/pip" install --only-binary :all: --require-hashes \
            -r "$RUNNER_TEMP/parity-python/requirements.txt"
          echo "$RUNNER_TEMP/parity-python/bin" >> "$GITHUB_PATH"

      # The host's rustup selects rust-toolchain.toml's channel. Its cargo home
      # and the Tint source cache (~/Library/Caches/noisemaker-tint) persist on
      # the host, so the job restores no cache over them.
      - name: Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust toolchain and GPU
        run: |
          rustup show active-toolchain
          rustc --version
          system_profiler SPDisplaysDataType

      - name: GPU host and render CLI regression tests
        run: cargo test --release -p noisemaker-for-rust-gpu -p nm-render -- --test-threads=1

      - name: scripts/parity-summary
        run: |
          set -o pipefail
          scripts/parity-summary 2>&1 | tee parity-summary.log

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-summary
          path: parity-summary.log
          if-no-files-found: ignore

      - name: WebGL2 grade (report, not a gate)
        if: always()
        continue-on-error: true
        env:
          NM_GOLDEN_BACKEND: webgl2
        run: |
          set -o pipefail
          scripts/parity-summary 2>&1 | tee parity-webgl2.log

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-webgl2
          path: parity-webgl2.log
          if-no-files-found: ignore
