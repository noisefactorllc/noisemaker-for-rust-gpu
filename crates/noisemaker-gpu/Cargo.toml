[package]
name = "noisemaker-for-rust-gpu"
description = "GPU renderer for the Noisemaker effect catalog: the Polymorphic DSL and the reference WebGPU pipeline on wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["noisemaker", "wgpu", "webgpu", "shaders", "generative"]
categories = ["graphics", "rendering", "rendering::engine", "multimedia::images"]

[lib]
name = "noisemaker_gpu"

[dependencies]
noisemaker-dsl = { path = "../noisemaker-dsl", version = "0.1.0" }
noisemaker-effects = { path = "../noisemaker-effects", version = "0.1.0" }
noisemaker-host = { path = "../noisemaker-host", version = "0.1.0" }
noisemaker-input = { path = "../noisemaker-input", version = "0.1.0" }
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true
pollster.workspace = true
half.workspace = true
png.workspace = true
naga = { version = "30", features = ["wgsl-in"] }
regex = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
# Tint at Chromium's Dawn revision (the Metal shader compiler; backend/shaders.rs).
noisemaker-tint = { path = "../noisemaker-tint", version = "0.1.0" }
# The Metal GPU family query of Dawn's toggles (the version wgpu-hal uses).
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }

[dev-dependencies]
# The viewer example's window and event loop (Apache-2.0).
winit = "0.30"
