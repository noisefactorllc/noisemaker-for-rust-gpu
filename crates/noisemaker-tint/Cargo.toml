[package]
name = "noisemaker-tint"
description = "Tint, the WGSL compiler of Dawn and Chromium, at a pinned Dawn revision: WGSL to MSL exactly as Dawn's Metal backend generates it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["tint", "dawn", "wgsl", "msl", "metal"]
categories = ["graphics", "rendering"]
links = "nm_tint"
build = "build.rs"
# LICENSE-dawn.txt (BSD-3-Clause), LICENSE-abseil-cpp.txt (Apache-2.0) and
# LICENSE-spirv-headers.txt are the license texts, at the commits dawn.json
# pins, of the third-party sources the build compiles into the static
# library it links on Apple targets.
include = [
    "Cargo.toml",
    "build.rs",
    "dawn.json",
    "LICENSE-*.txt",
    "cmake/**",
    "shim/**",
    "src/**",
    "tests/**",
]

[dependencies]

[build-dependencies]
serde_json.workspace = true
